name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: aai
          POSTGRES_PASSWORD: aai
          POSTGRES_DB: aai
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aai -d aai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Solo esta. `aai_test` y `aai_verify` se derivan de acá y las crean sus
      # propios pasos: `test:db` la primera, y los gates conductuales la segunda.
      DATABASE_URL: postgres://aai:aai@localhost:5432/aai

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ── Puertas de calidad ────────────────────────────────────────────────
      # Cada una codifica una promesa del producto. No son "buenas prácticas":
      # son las condiciones bajo las cuales el sistema es lo que dice ser.
      #
      # La secuencia y los comandos salen de `scripts/pipeline.mjs`, que es la
      # única definición del pipeline. Los pasos están escritos uno por uno acá
      # —y no como un `npm run ci`— para que la interfaz de GitHub muestre cuál
      # falló sin abrir el log; `tests/security/pipeline.test.ts` comprueba que
      # los dos no puedan divergir.

      - name: Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Lint de arquitectura (ADR-001)
        run: npm run lint:arch

      - name: Prohibido el punto flotante en importes
        run: npm run check:no-float

      - name: Integridad del archivo normativo
        run: npm run norms:verify

      - name: Crear base y migrar
        run: npm run db:setup

      - name: Migraciones idempotentes
        # Correrlas dos veces no debe cambiar nada ni fallar.
        run: npm run db:setup

      # Este paso faltaba, y su ausencia hacía que CI no pudiera funcionar.
      #
      # `tests/setup-env.ts` redirige DATABASE_URL a `aai_test` antes de importar
      # una sola suite —para que los tests no escriban en la base de desarrollo,
      # que es correcto— y hasta el 2026-08-28 nadie creaba esa base en CI. Cada
      # suite de integración habría fallado al conectar. No se detectó porque el
      # repositorio no tiene remoto y el workflow nunca se ejecutó.
      - name: Crear y migrar la base de tests
        run: npm run test:db

      # Con cobertura, no `npm test` a secas. Los umbrales por paquete están en
      # la configuración de vitest y hasta el 2026-08-28 solo los hacía cumplir
      # el `npm run verify` local: en CI un paquete podía caer por debajo del
      # umbral y el pipeline seguía verde.
      - name: Tests (con umbrales de cobertura)
        run: npm run test:coverage

      # ── El gate de invariantes ────────────────────────────────────────────
      # Van en dos pasos porque son dos preguntas distintas. La estructural no
      # necesita datos —pregunta si los candados están— y por eso puede correr
      # sobre la base recién migrada. La conductual se crea su propia base,
      # recorre los flujos productivos reales y recién entonces verifica.

      - name: Invariantes — estructura (los candados están)
        run: npm run audit:estructura

      - name: Invariantes — conducta (base aislada, fixtures y verificación)
        run: npm run audit:invariants

      # El Mayor contra el Diario. Corre en modo conductual: base aislada,
      # fixtures, y falla si no hubo movimientos que comparar.
      - name: El Mayor coincide con el Diario (ACCOUNTING_ENGINE.md §7)
        run: npm run ledger:verify

  # El archivo normativo se verifica también de forma independiente, para que un
  # cambio en el código no pueda enmascarar una alteración de los originales.
  normative-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificar hashes de los documentos oficiales
        run: node scripts/verify-norm-archive.mjs
